<style>
@import url('https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap');
body{margin:0;padding:24px;background:#EFE1C0;display:flex;justify-content:center}
.mv-page-frame{max-width:760px;width:100%}
.mv-wrap{position:relative;--parchment:#EFE1C0;--ink:#2B2118;--ink-soft:#5B4A34;--rubric:#7A1F2B;--gold:#9C7A2E;--border-brown:#8B7355;--line:rgba(43,33,24,.18);--line-strong:rgba(43,33,24,.38);--panel-bg:rgba(239,225,192,0.55);
font-family:"EB Garamond",Georgia,serif;background:var(--parchment);color:var(--ink);border-radius:8px;overflow:hidden;font-size:16px;line-height:1.6}

.mv-header,.mv-article-wrap{position:relative;z-index:1}
.mv-header{z-index:5}
.mv-header{border-bottom:3px double var(--border-brown);padding:18px 24px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px}
.mv-brand{font-family:"Pinyon Script",cursive;font-weight:400;font-size:2.3rem;letter-spacing:.01em;color:var(--ink);display:flex;align-items:center;gap:6px;text-decoration:none}
.mv-candle-icon{width:32px;height:auto;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.15));transform:rotate(240deg)}
.mv-brand span{color:var(--rubric)}
.mv-brand span.mv-avalon-word{position:relative;cursor:pointer;display:inline-block;color:#000}
.mv-avalon-tip{position:absolute;top:calc(100% + 12px);left:0;transform:translateY(-6px);background:#ffffff;color:#000000;font-family:"EB Garamond",serif;font-style:normal;font-weight:400;font-size:.72rem;line-height:1.45;padding:10px 14px;border-radius:6px;border:1px solid rgba(43,33,24,.15);white-space:normal;width:230px;text-align:left;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:20}
.mv-avalon-tip::after{content:"";position:absolute;bottom:100%;left:24px;border:6px solid transparent;border-bottom-color:#ffffff}
.mv-avalon-word.mv-tip-active .mv-avalon-tip{opacity:1;pointer-events:auto;transform:translateY(0)}
.mv-avalon-word:hover .mv-avalon-tip{opacity:1;pointer-events:auto;transform:translateY(0)}
.mv-brand,.mv-brand:visited,.mv-brand:focus,.mv-brand:active{background:transparent;outline:none;-webkit-tap-highlight-color:transparent}
.mv-nav{display:flex;gap:20px;font-family:"Cinzel",serif;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
.mv-nav a{color:var(--ink-soft);text-decoration:none}
.mv-nav a:hover{color:var(--rubric)}
.mv-article-wrap{padding:36px 24px 48px}
.mv-back{display:inline-block;font-family:"Cinzel",serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none;margin-bottom:22px}
.mv-back:hover{color:var(--rubric)}
.mv-article-meta{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.mv-article-date{font-family:"Cinzel",serif;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.mv-article-kind{display:inline-block;font-family:"Cinzel",serif;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rubric);border:1px solid var(--rubric);padding:2px 6px}
.mv-article-title{font-family:"EB Garamond",serif;font-weight:600;font-style:italic;font-size:2rem;line-height:1.2;margin:0 0 24px;max-width:20ch}
.mv-article p{max-width:62ch;color:var(--ink);font-size:1.02rem;margin:0 0 20px;line-height:1.75}
.mv-article p:first-of-type::first-letter{font-family:"Cinzel Decorative",serif;font-weight:700;font-size:3.1rem;float:left;line-height:0.8;padding:4px 10px 0 0;color:var(--rubric)}
.mv-divider{width:60px;height:1px;background:var(--line-strong);margin:32px 0}
.mv-sign{font-family:"EB Garamond",serif;font-style:italic;color:var(--ink-soft);font-size:.9rem;text-align:right}
.mv-loading{text-align:center;padding:48px;color:var(--ink-soft);font-style:italic}
.mv-spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--rubric);border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.mv-error{text-align:center;padding:48px;color:var(--rubric);font-style:italic}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function() {
  'use strict';
  firebase.initializeApp({
    apiKey: "AIzaSyCRcKI8WNSvo_v1Em7p93FwV8vATMQUIBI",
    authDomain: "aysesite2.firebaseapp.com",
    projectId: "aysesite2",
    storageBucket: "aysesite2.firebasestorage.app",
    messagingSenderId: "254142189527",
    appId: "1:254142189527:web:98397320ede7cb52b84592"
  });
  var db = firebase.firestore();
  var wrap = document.getElementById('articleWrap');

  // Get slug from URL
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug');

  if (!slug) {
    wrap.innerHTML = '<div class="mv-error">No chronicle specified. <a href="blogs.html" style="color:var(--rubric)">Return to the index →</a></div>';
    return;
  }

  // Load blog by slug
  db.collection('blogs').where('slug', '==', slug).limit(1).get().then(function(snapshot) {
    if (snapshot.empty) {
      wrap.innerHTML = '<div class="mv-error">Chronicle not found. <a href="blogs.html" style="color:var(--rubric)">Return to the index →</a></div>';
      return;
    }

    var doc = snapshot.docs[0];
    var d = doc.data();

    // Update page title
    document.title = esc(d.title) + ' — Avalon Chronicles';

    // Set html lang
    if (d.lang) document.documentElement.lang = d.lang;

    // Build article HTML
    var html = '';
    html += '<a class="mv-back" href="blogs.html">← Back to the Chronicle</a>';
    html += '<div class="mv-article-meta">';
    html += '<span class="mv-article-date">' + esc(d.date) + '</span>';
    html += '<span class="mv-article-kind">' + esc(d.kind) + '</span>';
    html += '</div>';
    html += '<h1 class="mv-article-title">' + esc(d.title) + '</h1>';
    html += '<div class="mv-article">';

    // Split content by double newlines into paragraphs
    var paragraphs = (d.content || '').split(/\n\n+/);
    paragraphs.forEach(function(p) {
      p = p.trim();
      if (p) html += '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>';
    });

    html += '</div>';

    if (d.sign) {
      html += '<div class="mv-divider"></div>';
      html += '<p class="mv-sign">' + esc(d.sign) + '</p>';
    }

    wrap.innerHTML = html;
  }).catch(function(err) {
    wrap.innerHTML = '<div class="mv-error">Error loading chronicle: ' + esc(err.message) + '</div>';
  });

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  // Avalon tooltip
  document.querySelectorAll('.mv-avalon-word').forEach(function(w) {
    w.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      w.classList.toggle('mv-tip-active');
    });
  });
  document.addEventListener('click', function() {
    document.querySelectorAll('.mv-avalon-word.mv-tip-active').forEach(function(w) { w.classList.remove('mv-tip-active'); });
  });
})();
</script>
